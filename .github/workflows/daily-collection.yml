name: BMW 420i daily collection
on:
  schedule:
    # 23:00 UTC is 08:00 on the following calendar day in Asia/Seoul.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Optional comma-separated source IDs; empty collects all sources'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: bmw-420i-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Install headless Chromium for dynamic searches
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Verify model, price, state and retention rules
        run: python -m unittest discover -s tests -v
      - name: Collect public listing observations
        env:
          COLLECTION_SOURCES: ${{ inputs.sources || '' }}
        run: |
          if [ -n "$COLLECTION_SOURCES" ]; then
            python -m collector.run --sources "$COLLECTION_SOURCES"
          else
            python -m collector.run
          fi
      - name: Validate public dataset
        run: python -m collector.validate
      - name: Publish observed data to the existing data URL
        run: |
          git config user.name '420i-price-watch'
          git config user.email '420i-price-watch@users.noreply.github.com'
          git add dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed BMW 420i listing data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
